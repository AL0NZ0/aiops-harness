# 写权限 K8s MCP 的认证入口。
# 复制后只改两处：proxy_pass 的集群服务名、下面的 Bearer token。
# token 用 openssl rand -hex 32 生成，同一个值填到平台 MCP 配置的 Authorization header。

server {
    listen 8766;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 16m;

    if ($http_authorization != "Bearer CHANGE_ME_USE_OPENSSL_RAND_HEX_32") {
        return 401;
    }

    location / {
        proxy_pass http://mcp-k8s-cluster-a:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}