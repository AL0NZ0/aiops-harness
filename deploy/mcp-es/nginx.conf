# 单 MCP 认证：token 直接写在这里，复制目录后换成 openssl rand -hex 32 的值。
# 真实 token 只写在复制出去的那份，不要改回仓库模板。
server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 16m;

    if ($http_authorization != "Bearer CHANGE_ME_USE_OPENSSL_RAND_HEX_32") {
        return 401;
    }

    location / {
        proxy_pass http://mcp-es:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 不要把这个 Bearer 透传给上游：ES MCP 会把它当 ES 的 API key 发给集群，
        # 覆盖 ES_USERNAME/ES_PASSWORD，导致所有查询 401。
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}