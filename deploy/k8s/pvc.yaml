apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiops-data
  namespace: aiops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiops-backups
  namespace: aiops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aiops-mysql-data
  namespace: aiops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi