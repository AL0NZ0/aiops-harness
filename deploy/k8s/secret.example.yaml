# 复制成 secret.yaml 后填入真实值，不要提交 secret.yaml。
# stringData 方便手填；生产建议用 External Secrets / SealedSecrets 管理。
# 生成参考：
#   AIOPS_SECRET_KEY: openssl rand -base64 32
#   AIOPS_ADMIN_PASSWORD / AIOPS_INTERNAL_TOKEN / AIOPS_METRICS_TOKEN / BACKUP_PASSPHRASE / MCP_* / MYSQL_*: openssl rand -base64 24
apiVersion: v1
kind: Secret
metadata:
  name: aiops-secrets
  namespace: aiops
type: Opaque
stringData:
  # 空库首次启动时创建管理员；只在用户表为空时生效。
  # 首次登录会强制改密，改完密码后这里的初始值不再生效。
  AIOPS_ADMIN_USERNAME: "admin"
  AIOPS_ADMIN_PASSWORD: "replace-with-strong-admin-password"
  # 32 字节 base64，或 64 位 hex；丢失等于所有加密凭证永久丢失，必须单独备份。
  # 全新部署用 openssl rand -base64 32 生成；迁移已有 data/ 或恢复旧备份时必须沿用原 data/secret.key。
  # 不要保留下面的占位值，它不是合法 key，平台会启动失败。数据落盘后不能更换。
  AIOPS_SECRET_KEY: "replace-with-32-byte-base64-key"
  # 内部工具调用 token；覆盖 ConfigMap 里空的 internalToken，不能留占位值。
  AIOPS_INTERNAL_TOKEN: "replace-with-internal-token"
  # 备份加密口令；丢失后已有备份无法恢复，必须和 AIOPS_SECRET_KEY 分开保管。
  BACKUP_PASSPHRASE: "replace-with-strong-backup-passphrase"
  # 上游 MCP token；平台配置里用 ${MCP_K8S_TOKEN} 引用。
  MCP_K8S_TOKEN: "replace-with-mcp-token"
  MCP_VM_TOKEN: "replace-with-mcp-token"
  MCP_ES_TOKEN: "replace-with-mcp-token"
  # 保护 /metrics；Prometheus 抓取时必须带同一个 Bearer token。
  # 不设置时 /metrics 在 Ingress 后面匿名可读，preflight 会拒绝。
  AIOPS_METRICS_TOKEN: "replace-with-metrics-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: aiops
type: Opaque
stringData:
  # MYSQL_* 只在 MySQL 数据目录首次初始化时生效；已有 PVC 改密码要同步 ALTER USER。
  MYSQL_ROOT_PASSWORD: "replace-with-strong-root-password"
  MYSQL_USER: "aiops"
  MYSQL_PASSWORD: "replace-with-strong-aiops-password"
  MYSQL_DATABASE: "aiops"