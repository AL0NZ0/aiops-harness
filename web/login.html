<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · AIOps Harness</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      .login-wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top, #e8f3ff 0, var(--bg) 46%);
      }
      .login-card {
        width: min(380px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
      }
      .login-card h1 { font-size: 20px; margin-bottom: 6px; }
      .login-card p { margin: 0 0 22px; color: var(--muted); }
      .login-card label { display: block; margin-bottom: 14px; color: var(--secondary); }
      .login-card input { width: 100%; margin-top: 6px; }
      .login-card button { width: 100%; margin-top: 6px; }
    </style>
  </head>
  <body>
    <main class="login-wrap">
      <form id="login-form" class="login-card">
        <h1>AIOps Harness</h1>
        <p>使用平台账号登录</p>
        <label>用户名<input name="username" autocomplete="username" required autofocus /></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required /></label>
        <p id="login-error" class="error" hidden></p>
        <button type="submit" class="primary">登录</button>
      </form>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
